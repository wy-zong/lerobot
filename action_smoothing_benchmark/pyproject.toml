[project]
name = "action-smoothing-benchmark"
version = "0.1.0"
description = "Offline benchmark for action-chunk smoothing methods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=6.0",
  "pyarrow>=16.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
action-smoothing-benchmark = "action_smoothing_benchmark.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

